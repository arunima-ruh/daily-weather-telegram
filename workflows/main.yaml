name: daily-weather-report
description: "Fetch weather forecast and deliver via Telegram"

steps:
  - id: provision-database
    skill: data-writer
    description: "Provision database schema (first run only)"
    action: provision
    continue_on_error: true

  - id: fetch-weather
    skill: weather-fetcher
    description: "Fetch weather forecast for SASARAM"
    depends_on: [provision-database]

  - id: format-message
    skill: weather-formatter
    description: "Format weather data into readable message"
    depends_on: [fetch-weather]

  - id: deliver-telegram
    skill: telegram-delivery
    description: "Send to Telegram and log delivery"
    depends_on: [format-message]
